<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IBONDA - Real Estate Agency Management & Automation SaaS</title>
  <meta name="description" content="منظومة ذكية متكاملة لإدارة الوكالات العقارية وأتمتة التواصل وتأهيل العملاء وجدولة المعاينات في المغرب." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background-color: #070d1e;
      color: #f1f5f9;
      scroll-behavior: smooth;
    }
    body.font-latin-body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .font-latin { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    .hero-glow {
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.18) 0%, rgba(30, 58, 138, 0.08) 45%, transparent 75%);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
    }
  </style>
</head>

<body x-data="ibondaApp()" x-init="init()" :class="lang === 'ar' ? '' : 'font-latin-body'" class="min-h-screen selection:bg-blue-600 selection:text-white">

  <!-- 1. الهايدر: اسم الوكالة + محول اللغات فقط -->
  <header class="sticky top-0 z-50 w-full bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

      <a href="#" class="font-latin text-2xl font-black tracking-tight text-white flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-sm bg-blue-500 inline-block shadow-sm shadow-blue-500/50"></span>
        <span>IBONDA</span>
      </a>

      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-1 text-xs">
        <button @click="setLang('ar')" :class="lang === 'ar' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1.5 rounded transition">العربية</button>
        <button @click="setLang('en')" :class="lang === 'en' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1.5 rounded transition font-latin">EN</button>
        <button @click="setLang('fr')" :class="lang === 'fr' ? 'bg-blue-600 text-white font-bold' : 'text-slate-400 hover:text-white'" class="px-2.5 py-1.5 rounded transition font-latin">FR</button>
      </div>

    </div>
  </header>

  <main>
    <!-- 2. الـ HERO ومشغل الفيديو -->
    <section class="relative pt-16 sm:pt-24 pb-20 hero-glow overflow-hidden text-center">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

        <div class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-blue-400 mb-6">
          <span x-text="t().hero.trustBadge"></span>
          <span>·</span>
          <span class="font-latin font-bold">IBONDA</span>
        </div>

        <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold text-white tracking-tight leading-[1.25] mb-6 max-w-4xl mx-auto" x-text="t().hero.title"></h1>

        <p class="text-base sm:text-xl text-slate-300 leading-relaxed max-w-3xl mx-auto mb-12" x-text="t().hero.subtitle"></p>

        <!-- مشغل الفيديو -->
        <div id="vsl-section" class="w-full max-w-4xl mx-auto">
          <div class="relative aspect-video w-full rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-2xl ring-1 ring-blue-500/20">

            <div class="w-full h-full relative overflow-hidden bg-[#060b1c] flex flex-col items-center justify-center p-6 text-center">
              <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 1px 1px, #3b82f6 1px, transparent 0); background-size: 24px 24px;"></div>

              <template x-if="!hasStarted">
                <div class="relative z-10 max-w-lg mx-auto">
                  <div class="text-xs font-semibold text-blue-400 mb-2 uppercase" x-text="t().hero.trustBadge"></div>
                  <h3 class="text-xl sm:text-3xl font-extrabold text-white mb-3" x-text="t().hero.vslTitle"></h3>
                  <p class="text-xs sm:text-sm text-slate-300 leading-relaxed mb-6" x-text="t().hero.vslSubtitle"></p>
                </div>
              </template>

              <template x-if="hasStarted">
                <div class="relative z-10 max-w-xl mx-auto">
                  <span class="text-xs font-semibold text-blue-400 mb-2 block" x-text="getCurrentSlide().tag"></span>
                  <h4 class="text-base sm:text-2xl font-bold text-white mb-2" x-text="getCurrentSlide().title"></h4>
                  <p class="text-xs sm:text-sm text-slate-300 mb-6" x-text="getCurrentSlide().desc"></p>

                  <div class="flex items-center justify-center gap-1.5 h-7">
                    <div class="w-1 bg-blue-500 rounded-full h-4 animate-pulse"></div>
                    <div class="w-1 bg-blue-500 rounded-full h-6 animate-pulse"></div>
                    <div class="w-1 bg-blue-500 rounded-full h-3 animate-pulse"></div>
                    <div class="w-1 bg-blue-500 rounded-full h-5 animate-pulse"></div>
                  </div>
                </div>
              </template>
            </div>

            <!-- زر التشغيل الكبير -->
            <template x-if="!isPlaying">
              <div @click="togglePlay()" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/25 cursor-pointer">
                <button class="p-6 sm:p-7 rounded-full bg-blue-600 text-white shadow-2xl hover:scale-105 transition active:scale-95">
                  <svg class="w-9 h-9 fill-white translate-x-[2px]" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
              </div>
            </template>

            <!-- إشعار انتهاء الفيديو -->
            <template x-if="videoCompleted">
              <div class="absolute top-4 inset-x-4 z-20 bg-blue-950/95 border border-blue-500/50 rounded-xl p-3.5 flex items-center justify-between gap-3 text-start shadow-xl">
                <div>
                  <p class="text-xs sm:text-sm font-semibold text-white" x-text="t().hero.videoEndedTitle"></p>
                  <p class="text-[11px] text-slate-300" x-text="t().hero.videoEndedDesc"></p>
                </div>
                <button @click="scrollToBooking()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-medium px-3.5 py-1.5 rounded-lg whitespace-nowrap cursor-pointer" x-text="t().hero.goToBooking"></button>
              </div>
            </template>

            <!-- عناصر التحكم: شريط تقدم أحادي الاتجاه + زر تشغيل + صوت + ملء الشاشة -->
            <div class="absolute bottom-0 inset-x-0 z-30 p-3 sm:p-4 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent">
              <!-- pointer-events-none: لا يمكن سحب الشريط، يتحرك مع التشغيل فقط -->
              <input type="range" min="0" :max="duration" step="0.1" :value="currentTime" tabindex="-1" aria-hidden="true" class="w-full h-1.5 bg-slate-700/80 rounded appearance-none accent-blue-500 mb-2 pointer-events-none">

              <div class="flex items-center justify-between text-xs text-white">
                <div class="flex items-center gap-3">
                  <button @click="togglePlay()" class="p-1.5 hover:text-blue-400">
                    <span x-show="!isPlaying">▶</span>
                    <span x-show="isPlaying">❚❚</span>
                  </button>
                  <button @click="toggleMute()" class="p-1 hover:text-blue-400">
                    <span x-show="!muted">🔊</span>
                    <span x-show="muted">🔇</span>
                  </button>
                </div>
                <button @click="toggleFullscreen()" class="p-1 hover:text-blue-400" aria-label="fullscreen">⛶</button>
              </div>
            </div>

          </div>
        </div>

        <!-- بعد انتهاء الفيديو -->
        <template x-if="videoCompleted">
          <div class="max-w-2xl mx-auto mt-8 p-6 rounded-2xl bg-gradient-to-b from-blue-950/70 to-slate-900 border border-blue-500/30 text-center">
            <h3 class="text-xl font-bold text-white mb-2" x-text="t().postCta.title"></h3>
            <p class="text-sm text-slate-300 mb-6" x-text="t().postCta.subtitle"></p>
            <button @click="scrollToBooking()" class="px-8 py-4 text-base font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl shadow-lg shadow-blue-600/40 cursor-pointer" x-text="t().postCta.button"></button>
          </div>
        </template>

      </div>
    </section>

    <!-- 3. قدرات المنظومة -->
    <section id="capabilities" class="py-24 bg-white text-slate-900 border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mb-16 text-start">
          <div class="text-xs font-semibold text-blue-600 mb-2" x-text="t().capabilities.kicker + ' · ' + t().capabilities.category"></div>
          <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-950 mb-4" x-text="t().capabilities.title"></h2>
          <p class="text-base sm:text-lg text-slate-600" x-text="t().capabilities.subtitle"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <template x-for="(item, idx) in t().capabilities.items" :key="idx">
            <div class="p-6 rounded-2xl bg-slate-50 border border-slate-200 hover:border-blue-400 transition">
              <span class="text-xs font-medium text-slate-500 block mb-2" x-text="'0' + (idx+1) + '. ' + item.badge"></span>
              <h3 class="text-lg font-bold text-slate-900 mb-2" x-text="item.title"></h3>
              <p class="text-sm text-slate-600" x-text="item.desc"></p>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- 4. الفوائد -->
    <section id="benefits" class="py-24 bg-slate-50 text-slate-900 border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mb-16 text-start">
          <div class="text-xs font-bold text-emerald-600 mb-2" x-text="t().benefits.kicker + ' · ' + t().benefits.category"></div>
          <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-950 mb-4" x-text="t().benefits.title"></h2>
          <p class="text-base sm:text-lg text-slate-600" x-text="t().benefits.subtitle"></p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <template x-for="(item, idx) in t().benefits.items" :key="idx">
            <div class="p-6 rounded-2xl bg-white border border-slate-200 hover:border-emerald-300 transition">
              <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold mb-4 border border-emerald-100">✓</div>
              <h3 class="text-lg font-bold text-slate-900 mb-2" x-text="item.title"></h3>
              <p class="text-sm text-slate-600" x-text="item.desc"></p>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- 5. حاسبة الخسائر -->
    <section id="calculator" class="py-24 bg-slate-950 text-slate-100 border-t border-slate-900">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mb-16 text-start">
          <div class="text-xs font-semibold text-blue-400 mb-2" x-text="t().calculator.kicker + ' · ' + t().calculator.category"></div>
          <h2 class="text-2xl sm:text-4xl font-extrabold text-white mb-4" x-text="t().calculator.title"></h2>
          <p class="text-slate-300" x-text="t().calculator.subtitle"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
            <div>
              <div class="flex justify-between text-sm font-semibold mb-2">
                <span x-text="t().calculator.leadsLostLabel"></span>
                <span class="text-blue-400 font-bold" x-text="leadsLost + ' ' + t().calculator.perMonth"></span>
              </div>
              <input type="range" min="1" max="200" x-model.number="leadsLost" class="w-full h-2 bg-slate-700 rounded accent-blue-500">
            </div>

            <div>
              <div class="flex justify-between text-sm font-semibold mb-2">
                <span x-text="t().calculator.avgCommissionLabel"></span>
                <span class="text-blue-400 font-bold" x-text="avgCommission + ' MAD'"></span>
              </div>
              <input type="range" min="500" max="100000" step="500" x-model.number="avgCommission" class="w-full h-2 bg-slate-700 rounded accent-blue-500">
            </div>

            <div>
              <div class="flex justify-between text-sm font-semibold mb-2">
                <span x-text="t().calculator.closingRateLabel"></span>
                <span class="text-blue-400 font-bold" x-text="closingRate + ' %'"></span>
              </div>
              <input type="range" min="1" max="50" x-model.number="closingRate" class="w-full h-2 bg-slate-700 rounded accent-blue-500">
            </div>

            <div class="grid grid-cols-3 gap-3 pt-4 border-t border-slate-800 text-center">
              <div class="p-3 bg-slate-950 rounded-xl">
                <div class="text-[11px] text-slate-400" x-text="t().calculator.lostDealsTitle"></div>
                <div class="text-lg font-bold text-white font-latin" x-text="calcDeals()"></div>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl">
                <div class="text-[11px] text-slate-400" x-text="t().calculator.moneyLostMonthTitle"></div>
                <div class="text-lg font-bold text-rose-400 font-latin" x-text="calcMonthlyLoss() + ' MAD'"></div>
              </div>
              <div class="p-3 bg-slate-950 rounded-xl">
                <div class="text-[11px] text-slate-400" x-text="t().calculator.moneyLostYearTitle"></div>
                <div class="text-lg font-bold text-amber-400 font-latin" x-text="calcYearlyLoss() + ' MAD'"></div>
              </div>
            </div>

            <p class="text-[11px] text-slate-500 text-center" x-text="t().calculator.note"></p>
          </div>

          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
            <div>
              <div class="p-4 rounded-xl border mb-6" :class="dangerClasses()">
                <div class="font-bold text-sm mb-1" x-text="getDangerLabel()"></div>
                <p class="text-xs leading-relaxed" x-text="getDangerMsg()"></p>
              </div>
            </div>

            <button @click="handleCtaClick()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition cursor-pointer" x-text="t().calculator.ctaButton"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 6. المقارنة -->
    <section id="comparison" class="py-24 bg-white text-slate-900 border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl mb-16 text-start">
          <div class="text-xs font-semibold text-blue-600 mb-2" x-text="t().comparison.kicker + ' · ' + t().comparison.category"></div>
          <h2 class="text-2xl sm:text-4xl font-extrabold text-slate-950 mb-4" x-text="t().comparison.title"></h2>
          <p class="text-base sm:text-lg text-slate-600" x-text="t().comparison.subtitle"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- البطاقة التقليدية (أحمر) -->
          <div class="rounded-2xl border-2 border-rose-300 bg-rose-50/20 p-6 sm:p-8 flex flex-col justify-between relative">
            <div class="absolute top-0 end-8 -translate-y-1/2 bg-rose-600 text-white text-xs font-bold px-3 py-1 rounded-full" x-text="t().comparison.traditionalBadge"></div>
            <div>
              <div class="flex items-center justify-between pb-6 mb-6 border-b border-rose-200">
                <h3 class="text-xl font-bold text-slate-900" x-text="t().comparison.traditionalTitle"></h3>
                <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center font-bold">✕</div>
              </div>
              <div class="space-y-4">
                <template x-for="item in t().comparison.items" :key="item.category">
                  <div class="flex items-start gap-3">
                    <span class="text-rose-600 font-bold">✕</span>
                    <div>
                      <h4 class="text-sm font-semibold text-slate-900" x-text="item.category"></h4>
                      <p class="text-sm text-slate-600" x-text="item.traditional"></p>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <div class="mt-8 pt-6 border-t border-rose-200 text-xs font-semibold text-rose-600" x-text="t().comparison.traditionalFooter"></div>
          </div>

          <!-- بطاقة IBONDA (أخضر) -->
          <div class="rounded-2xl border-2 border-emerald-500/50 bg-emerald-50/25 p-6 sm:p-8 flex flex-col justify-between relative shadow-lg shadow-emerald-500/5">
            <div class="absolute top-0 end-8 -translate-y-1/2 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full" x-text="t().comparison.ibondaBadge"></div>
            <div>
              <div class="flex items-center justify-between pb-6 mb-6 border-b border-emerald-200">
                <h3 class="text-xl font-bold text-slate-900" x-text="t().comparison.ibondaTitle"></h3>
                <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold">✓</div>
              </div>
              <div class="space-y-4">
                <template x-for="item in t().comparison.items" :key="item.category">
                  <div class="flex items-start gap-3">
                    <span class="text-emerald-600 font-bold">✓</span>
                    <div>
                      <h4 class="text-sm font-semibold text-slate-900" x-text="item.category"></h4>
                      <p class="text-sm text-slate-700" x-text="item.ibonda"></p>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <div class="mt-8 pt-6 border-t border-emerald-200 text-xs font-semibold text-emerald-700" x-text="t().comparison.ibondaFooter"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 7. الحجز (مقفل حتى نهاية الفيديو) -->
    <section id="booking" class="py-24 bg-slate-950 text-slate-100">
      <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center max-w-2xl mx-auto mb-10">
          <h2 class="text-2xl sm:text-4xl font-extrabold text-white mb-3" x-text="t().booking.title"></h2>
          <p class="text-sm sm:text-base text-slate-300" x-text="t().booking.subtitle"></p>
        </div>

        <template x-if="!videoCompleted">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 sm:p-12 text-center max-w-xl mx-auto">
            <div class="w-14 h-14 rounded-full bg-blue-600/15 text-blue-400 border border-blue-500/30 flex items-center justify-center mx-auto mb-4 text-2xl">🔒</div>
            <h3 class="text-base sm:text-lg font-bold text-white mb-2" x-text="t().booking.lockedNotice"></h3>
            <button @click="scrollToVideo()" class="mt-4 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl transition cursor-pointer" x-text="t().booking.watchNow"></button>
          </div>
        </template>

        <template x-if="videoCompleted">
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl">

            <!-- الخطوة 1 -->
            <template x-if="step === 1">
              <form @submit.prevent="submitStep1()" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-start">

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2" x-text="t().booking.fields.fullName + ' *'"></label>
                    <input type="text" x-model="form.fullName" required :placeholder="t().booking.fields.fullNamePlaceholder" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2" x-text="t().booking.fields.phone + ' *'"></label>
                    <input type="tel" dir="ltr" x-model="form.phone" required :placeholder="t().booking.fields.phonePlaceholder" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 font-latin text-end">
                    <p class="text-[10px] text-slate-500 mt-1" x-text="t().booking.fields.phoneHelper"></p>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2" x-text="t().booking.fields.agencyName + ' *'"></label>
                    <input type="text" x-model="form.agencyName" required :placeholder="t().booking.fields.agencyNamePlaceholder" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500">
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2" x-text="t().booking.fields.city + ' *'"></label>
                    <select x-model="form.city" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500">
                      <option value="" disabled x-text="t().booking.fields.cityPlaceholder"></option>
                      <template x-for="c in t().booking.moroccanCities" :key="c"><option :value="c" x-text="c"></option></template>
                    </select>
                  </div>

                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2" x-text="t().booking.fields.dailyLeads + ' *'"></label>
                    <select x-model="form.dailyLeads" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500">
                      <option value="" disabled x-text="t().booking.fields.dailyLeadsPlaceholder"></option>

        duration: 275,          // المدة بالثواني (4:35) - تُستخدم داخلياً فقط
        fastSeconds: 20,        // أول 20 ثانية بسرعة 1.5
        timer: null,
        step: 1,
        selectedTime: '',
        leadsLost: 10,
        avgCommission: 5000,
        closingRate: 10,
        form: { fullName: '', phone: '', agencyName: '', city: '', dailyLeads: '', agencyStaff: '' },

        init() {
          this.setLang('ar');
        },

        setLang(l) {
          this.lang = l;
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.lang = l;
        },

        // تشغيل المؤقت المحاكي - استبدله بـ video.play() و video.playbackRate عند ربط الفيديو الحقيقي
        startTimer() {
          if (this.timer) return;
          this.timer = setInterval(() => {
            const rate = this.currentTime < this.fastSeconds ? 1.5 : 1.0;
            this.currentTime = Math.min(this.duration, this.currentTime + 0.1 * rate);
            if (this.currentTime >= this.duration) {
              this.finishVideo();
            }
          }, 100);
        },

        pauseTimer() {
          clearInterval(this.timer);
          this.timer = null;
        },

        finishVideo() {
          this.pauseTimer();
          this.isPlaying = false;
          this.videoCompleted = true;
        },

        togglePlay() {
          this.hasStarted = true;
          this.isPlaying = !this.isPlaying;
          if (this.isPlaying) {
            this.startTimer();
          } else {
            this.pauseTimer();
          }
        },

        toggleMute() {
          this.muted = !this.muted;
        },

        toggleFullscreen() {
          const el = document.getElementById('vsl-section');
          if (!document.fullscreenElement) {
            el.requestFullscreen && el.requestFullscreen();
          } else {
            document.exitFullscreen && document.exitFullscreen();
          }
        },

        handleCtaClick() {
          if (!this.videoCompleted) {
            this.scrollToVideo();
          } else {
            this.scrollToBooking();
          }
        },

        scrollToVideo() {
          document.getElementById('vsl-section').scrollIntoView({ behavior: 'smooth' });
        },

        scrollToBooking() {
          document.getElementById('booking').scrollIntoView({ behavior: 'smooth' });

        submitStep1() {

        confirmBooking() {
          this.step = 3;
          if (window.confetti) {
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          }

        calcDeals() {
          return Math.round(this.leadsLost * (this.closingRate / 100) * 10) / 10;
        },

        calcMonthlyLoss() {
          return Math.round(this.calcDeals() * this.avgCommission);
        },

        calcYearlyLoss() {
          return this.calcMonthlyLoss() * 12;
        },

        getDangerLevel() {
          const l = this.calcMonthlyLoss();
          if (l < 10000) return 'low';
          if (l <= 50000) return 'mid';
          return 'high';
        },

        dangerClasses() {
          const level = this.getDangerLevel();
          if (level === 'low') return 'border-emerald-500 bg-emerald-500/10 text-emerald-400';
          if (level === 'mid') return 'border-amber-500 bg-amber-500/10 text-amber-400';
          return 'border-rose-500 bg-rose-500/10 text-rose-400';
        },

        getDangerLabel() {
          return this.t().calculator.dangerLabels[this.getDangerLevel()];

          return this.t().calculator.dangerMsgs[this.getDangerLevel()];
